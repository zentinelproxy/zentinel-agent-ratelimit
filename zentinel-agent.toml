# Zentinel Agent Registry Manifest
# Rate Limiting Agent - Token bucket rate limiting

[agent]
name = "zentinel-agent-ratelimit"
version = "0.1.0"
description = "Token bucket rate limiting agent for Zentinel reverse proxy"
authors = ["Zentinel Contributors"]
license = "Apache-2.0"
repository = "https://github.com/zentinelproxy/zentinel-agent-ratelimit"

[protocol]
version = "0.1"
events = ["request_headers"]

[compatibility]
zentinel-proxy = ">=0.1.0"
zentinel-agent-protocol = "0.1"

[registry]
homepage = "https://zentinelproxy.io/agents/ratelimit"
documentation = "https://zentinelproxy.io/docs/agents/ratelimit"
keywords = ["zentinel", "agent", "ratelimit", "rate-limiting", "token-bucket"]
categories = ["rate-limiting"]
